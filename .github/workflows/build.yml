name: Build Custom FiveM Client

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Generate Visual Studio 2022 Solution
      shell: powershell
      run: |
        if (Test-Path "vendor/bin/premake5.exe") {
            .\vendor\bin\premake5.exe vs2022
        } else {
            premake5 vs2022
        }

    - name: Build FiveM Client
      shell: cmd
      run: |
        msbuild FiveM.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

    - name: Package Build Artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        Copy-Item -Path "out/build/x64/Release/*" -Destination "dist" -Recurse -Force
        Compress-Archive -Path "dist/*" -DestinationPath "FiveM-Custom-Client.zip"

    - name: Upload Build Output Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FiveM-Custom-Client
        path: FiveM-Custom-Client.zip
