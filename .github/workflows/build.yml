name: Build FiveM Client Without Anticheat

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies (pip / yarn)
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools
          npm install -g yarn
          if (Test-Path 'package.json') {
            Write-Host "package.json found — installing node deps with yarn..."
            yarn install --frozen-lockfile || yarn install
          } else {
            Write-Host "No package.json found — skipping yarn install."
          }

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true

      - name: Remove Adhesive (Anticheat) Component
        shell: powershell
        run: |
          $componentsFile = "data/client/components.json"
          if (Test-Path $componentsFile) {
            try {
              $raw = Get-Content $componentsFile -Raw
              $json = $raw | ConvertFrom-Json -ErrorAction Stop

              if ($json -is [System.Collections.IEnumerable]) {
                # jeśli to tablica
                $filtered = $json | Where-Object { $_ -ne 'adhesive' }
                $filtered | ConvertTo-Json -Depth 10 | Set-Content $componentsFile -Encoding UTF8
                Write-Host "Removed 'adhesive' from components.json (array) successfully."
              } elseif ($json.PSObject.Properties.Name -contains 'components') {
                # jeśli to obiekt z polem components
                $json.components = $json.components | Where-Object { $_ -ne 'adhesive' }
                $json | ConvertTo-Json -Depth 10 | Set-Content $componentsFile -Encoding UTF8
                Write-Host "Removed 'adhesive' from components.json.components successfully."
              } else {
                Write-Host "components.json has unexpected structure; skipping modification."
              }
            } catch {
              Write-Host "Failed to parse or modify components.json: $_"
            }
          } else {
            Write-Host "components.json not found; skipping."
          }

      - name: Prepare and Generate Build Files
        shell: powershell
        run: |
          .\fxd.ps1 get-chrome
          .\fxd.ps1 prebuild
          .\fxd.ps1 gen -game five
          .\fxd.ps1 vs -game five

      - name: Build Solution with MSBuild
        run: |
          msbuild citizen.sln /restore /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FiveM-Client-NoAnticheat
          path: code/bin/five/release/**
