name: Build Custom FiveM Client

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Ensure Premake5 is present
      shell: powershell
      run: |
        if (-not (Test-Path "vendor/bin/premake5.exe")) {
            Write-Host "Downloading premake5..."
            New-Item -ItemType Directory -Force -Path "vendor/bin"
            Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip" -OutFile "premake5.zip"
            Expand-Archive -Path "premake5.zip" -DestinationPath "vendor/bin" -Force
            Remove-Item "premake5.zip"
        }

    - name: Generate Visual Studio 2022 Solution
      shell: powershell
      run: |
        .\vendor\bin\premake5.exe vs2022

    - name: Build FiveM Client
      shell: cmd
      run: |
        msbuild FiveM.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

    - name: Package Build Artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        Copy-Item -Path "out/build/x64/Release/*" -Destination "dist" -Recurse -Force
        Compress-Archive -Path "dist/*" -DestinationPath "FiveM-Custom-Client.zip"

    - name: Upload Build Output Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FiveM-Custom-Client
        path: FiveM-Custom-Client.zip
